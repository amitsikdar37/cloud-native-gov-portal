include classpath("application.conf")

# Node address for SQS endpoints
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

# 1. AWS SQS-Compatible REST Engine
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

# 2. Web Dashboard / Metrics UI (This enables port 9325!)
rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

# 3. Pre-create our Project Phoenix submission queue
queues {
  application-submissions {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
